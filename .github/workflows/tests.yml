name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y luajit

      - name: Verify test runtimes
        run: |
          command -v luajit
          command -v node

      - name: Run tests
        run: python3 -I -m unittest discover -s tests
